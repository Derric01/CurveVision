# CurveVision — self-hosted deployment.
#
#   cp .env.example .env    # then set CURVEVISION_SECRET_KEY
#   docker compose up -d
#   open http://localhost:8080
#
# Six services, deliberately: fewer moving parts to operate, back up and reason about.
# The module boundaries live in Python packages behind explicit interfaces rather than in
# separate deployments — see docs/ARCHITECTURE.md.

name: curvevision

x-api-env: &api-env
  CURVEVISION_ENVIRONMENT: ${CURVEVISION_ENVIRONMENT:-production}
  CURVEVISION_SECRET_KEY: ${CURVEVISION_SECRET_KEY:?Set CURVEVISION_SECRET_KEY in .env}
  CURVEVISION_DATABASE_URL: postgresql+asyncpg://curvevision:${POSTGRES_PASSWORD:-curvevision}@postgres:5432/curvevision
  CURVEVISION_REDIS_URL: redis://redis:6379/0
  CURVEVISION_JOB_QUEUE_BACKEND: dramatiq
  CURVEVISION_STORAGE_BACKEND: s3
  CURVEVISION_S3_ENDPOINT_URL: ${CURVEVISION_S3_ENDPOINT_URL:-http://s3:9000}
  CURVEVISION_S3_REGION: ${CURVEVISION_S3_REGION:-us-east-1}
  # Empty: media is streamed by the API, because browsers cannot reach http://s3:9000. Set
  # it when they can reach the store (docs/OPERATIONS.md).
  CURVEVISION_S3_PUBLIC_ENDPOINT_URL: ${CURVEVISION_S3_PUBLIC_ENDPOINT_URL:-}
  CURVEVISION_S3_BUCKET: ${CURVEVISION_S3_BUCKET:-curvevision}
  # MINIO_ROOT_* are still read, so an .env written for the MinIO-based stack keeps working.
  CURVEVISION_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-${MINIO_ROOT_USER:-curvevision}}
  CURVEVISION_S3_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-curvevision-dev-secret}}
  CURVEVISION_CORS_ORIGINS: ${CURVEVISION_CORS_ORIGINS:-http://localhost:8080}
  CURVEVISION_LOG_FORMAT: json
  # `api` scales horizontally, so its rate limit is counted in Redis, shared by every replica.
  CURVEVISION_RATE_LIMIT_BACKEND: ${CURVEVISION_RATE_LIMIT_BACKEND:-redis}
  # Malware scanning of uploads: `docker compose --profile scanning up -d`, and set
  # CURVEVISION_CONTENT_SCANNER=clamd in .env. Off by default (docs/OPERATIONS.md).
  CURVEVISION_CONTENT_SCANNER: ${CURVEVISION_CONTENT_SCANNER:-none}
  CURVEVISION_CLAMD_HOST: clamav

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: curvevision
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-curvevision}
      POSTGRES_DB: curvevision
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curvevision"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Redis is a cache and a broker here, never the source of truth: media chunks live in
    # object storage, which is why no on-disk Redis variant is needed.
    command: redis-server --save "" --appendonly no --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # S3-compatible object storage for media, thumbnails and exports: Versity Gateway, which
  # serves a directory as S3. Until October 2026 this was MinIO, whose images can no longer
  # be pulled anonymously; an installation that still has MinIO's data moves it across
  # with `curvevision-server backup` and `restore` (docs/OPERATIONS.md). Any S3 service
  # works instead: set CURVEVISION_S3_ENDPOINT_URL and the keys in .env.
  s3:
    image: versity/versitygw:v1.8.0
    # Metadata in a directory of its own rather than in extended attributes, which not
    # every volume driver keeps.
    command: ["--port", ":9000", "--health", "/health", "posix", "--sidecar", "/meta", "/objects"]
    environment:
      ROOT_ACCESS_KEY: ${S3_ACCESS_KEY:-${MINIO_ROOT_USER:-curvevision}}
      ROOT_SECRET_KEY: ${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-curvevision-dev-secret}}
    volumes:
      - s3-objects:/objects
      - s3-meta:/meta
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot: create the bucket, then exit. Without it the first upload fails with a
  # confusing S3 error rather than a clear setup step.
  storage-init:
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
    environment: *api-env
    depends_on:
      s3:
        condition: service_healthy
    command: curvevision-server storage-init
    restart: "no"

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    # Migrations run on start-up rather than in a separate job: a self-hoster running
    # `docker compose up` should end up with a working instance, not a schema error.
    command: >
      /bin/sh -c "alembic upgrade head &&
      uvicorn curvevision.main:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-2}"
    # Where `curvevision-server backup` writes and `restore` reads (docs/OPERATIONS.md). A
    # named volume, which takes its owner from the image — the server runs as a non-root
    # user, and a bind-mounted ./backups was not writable by it. `docker compose cp` moves
    # archives in and out.
    volumes:
      - backups:/backups
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
    environment: *api-env
    depends_on:
      api:
        condition: service_started
    # One worker image serves every queue. Split it by passing --queues when a deployment
    # genuinely needs isolation, rather than deploying a service per queue.
    command: >
      dramatiq curvevision.jobs.dramatiq_app
      --processes ${WORKER_PROCESSES:-2}
      --threads ${WORKER_THREADS:-4}
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

  # Only with `--profile scanning`. The image ships its signatures and keeps them current
  # with freshclam; clamd needs a minute or two, and about 1.5 GB of memory, to load them.
  clamav:
    image: clamav/clamav:stable
    profiles: ["scanning"]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
    restart: unless-stopped

volumes:
  backups:
  postgres-data:
  s3-objects:
  s3-meta:
