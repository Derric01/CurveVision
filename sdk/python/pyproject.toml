[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "curvevision-sdk"
version = "1.0.0"
description = "Python SDK and CLI for CurveVision, the open-source annotation platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CurveVision contributors" }]
keywords = ["computer-vision", "annotation", "dataset", "labeling", "sdk"]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/Derric01/CurveVision"
Download = "https://github.com/Derric01/CurveVision/releases/latest"
Documentation = "https://github.com/Derric01/CurveVision/tree/main/docs"
Issues = "https://github.com/Derric01/CurveVision/issues"

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
curvevision = "curvevision_sdk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["curvevision_sdk"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
