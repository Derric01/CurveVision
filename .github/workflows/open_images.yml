# CurveVision's Open Images export, read by Datumaro — and Datumaro's, read by us.
#
# `scripts/verify_open_images.py` has Datumaro read an export (with and without its images:
# `images.meta` carries their sizes) and compares every box, flag, mask and image label with
# what was written; then imports files written by Datumaro's own Open Images exporter.
#
# Not in `ci.yml`: Datumaro brings a scientific stack for code that changes rarely. The core
# suite holds the format to the same rules (`test_formats_open_images.py`); this job is the
# real reader, run whenever a format changes, weekly against its latest release, and on
# demand. Datumaro is never a dependency of CurveVision; it is installed here only to check
# our files.
name: Open Images

on:
  push:
    branches: [main]
    paths:
      - 'server/curvevision/formats/**'
      - 'scripts/verify_open_images.py'
      - '.github/workflows/open_images.yml'
  pull_request:
    paths:
      - 'server/curvevision/formats/**'
      - 'scripts/verify_open_images.py'
      - '.github/workflows/open_images.yml'
  schedule:
    # Mondays 05:30 UTC: catches a Datumaro release that changes what it reads or writes.
    - cron: '30 5 * * 1'
  workflow_dispatch:

concurrency:
  group: open-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  read-and-write:
    name: Our Open Images files in Datumaro, and Datumaro's in ours
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: Install the server and Datumaro
        run: |
          python -m pip install --upgrade pip
          pip install -e "server[media]"
          pip install datumaro

      - name: Read and write
        run: python scripts/verify_open_images.py
