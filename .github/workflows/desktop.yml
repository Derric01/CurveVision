# The desktop application's installers, built on each platform's own runner: PyInstaller
# does not cross-compile, so the server inside each installer has to be built where it
# will run. **Unsigned**: signing needs the project's own certificates (an Apple Developer
# ID, a Windows code-signing certificate), which it does not have yet — macOS will ask the
# person to open the app from System Settings, and Windows SmartScreen will warn.
name: Desktop installers

on:
  workflow_dispatch:
  # A release (`release.yml`) builds its installers by calling this workflow, rather than
  # this one also running on the same tag and building them twice.
  workflow_call:
  pull_request:
    paths:
      - 'desktop/**'
      - 'server/constraints.txt'
      - '.github/workflows/desktop.yml'
      # What the application's own harness exercises across the shell boundary.
      - 'scripts/verify_desktop_shell.py'
      - 'scripts/minisign.py'
      - 'web/src/features/updates/**'
      - 'web/src/desktop.ts'
      - 'web/src/features/tasks/TaskPage.tsx'
      - 'web/src/features/desktop/**'
      - 'server/curvevision/desktop.py'
      - 'server/pyproject.toml'

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: 'Linux (.deb, .rpm, .AppImage)', os: ubuntu-22.04, bundles: 'deb,rpm,appimage'}
          - {name: 'macOS (.dmg)', os: macos-14, bundles: 'app,dmg'}
          - {name: 'Windows (.exe installer)', os: windows-latest, bundles: nsis}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/shell/src-tauri

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf

      # The order matters: the server embeds the built editor.
      - name: The editor
        run: |
          npm ci --prefix web --no-audit --no-fund
          npm --prefix web run build

      - name: The server, packaged — and smoke-tested by the script that builds it
        run: |
          pip install -c server/constraints.txt -e "./server[media,desktop]"
          python desktop/sidecar/build.py

      # The shell's own tests, on each platform it ships to — including starting and
      # stopping the server just packaged, the way the application does.
      - name: The shell — format, lints, tests
        working-directory: desktop/shell/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      # Updates (src/updates.rs): the public key and the feed are compiled in, and the
      # updater's downloads signed, only when the repository has the maintainers' secrets. A
      # build without them — a fork's, a pull request's — says updates are not configured.
      # scripts/updater_manifest.py makes the release's latest.json from the .sig files.
      - name: The installers
        working-directory: desktop/shell/src-tauri
        shell: bash
        env:
          CURVEVISION_UPDATER_PUBKEY: ${{ secrets.CURVEVISION_UPDATER_PUBKEY }}
          CURVEVISION_UPDATE_URL: ${{ secrets.CURVEVISION_UPDATER_PUBKEY && 'https://github.com/Derric01/CurveVision/releases/latest/download/latest.json' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          updater=false
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && updater=true
          npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }} \
            --config "{\"build\":{\"beforeBuildCommand\":\"\"},\"bundle\":{\"createUpdaterArtifacts\":$updater}}"

      # Install the .deb as a person would, then start the server it carries and use it:
      # the handshake line, the API, and the editor it serves.
      - name: The .deb installs, and the server inside it serves
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./desktop/shell/src-tauri/target/release/bundle/deb/*.deb
          server=$(dpkg -L curve-vision | grep -m1 '/curvevision-local$')
          test -x /usr/bin/curvevision-desktop
          "$server" --print-data-dir
          "$server" --data-dir "$RUNNER_TEMP/data" > "$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          for _ in $(seq 60); do
            grep -q '^CURVEVISION_READY ' "$RUNNER_TEMP/server.log" && break
            sleep 1
          done
          cat "$RUNNER_TEMP/server.log"
          url=$(grep -m1 '^CURVEVISION_READY ' "$RUNNER_TEMP/server.log" \
            | cut -d' ' -f2- | python -c 'import json, sys; print(json.load(sys.stdin)["url"])')
          curl -fsS "$url/api/v1/health" | tee /dev/stderr | grep -q '"local_mode":true'
          curl -fsS "$url/" | grep -qi '<html'
          kill "$pid"

      - uses: actions/upload-artifact@v6
        with:
          name: curvevision-desktop-${{ runner.os }}
          path: |
            desktop/shell/src-tauri/target/release/bundle/deb/*.deb
            desktop/shell/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/shell/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/shell/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/shell/src-tauri/target/release/bundle/nsis/*.exe
            desktop/shell/src-tauri/target/release/bundle/*/*.sig
            desktop/shell/src-tauri/target/release/bundle/macos/*.app.tar.gz
          if-no-files-found: error
          retention-days: 14

  # The application itself — shell, webview and server — driven over WebDriver, which only
  # Linux offers (WebKitGTK's driver): the IPC bridge, the switch to a team server in a
  # window that cannot use the shell, the choice remembered, storage kept across launches
  # (scripts/verify_desktop_shell.py).
  #
  # On Ubuntu 24.04 rather than beside the 22.04 installer build: WebKitGTK 2.50's driver
  # there reset its connection, two runs in three, a moment after the shell closed a window
  # (iteration 85). Whether that is the driver or something a 22.04 user would meet is not
  # established; handoff.md carries it as a known issue rather than this job hiding it.
  webdriver:
    name: The application, driven over WebDriver (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/shell/src-tauri

      - name: Build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev \
            libayatana-appindicator3-dev webkit2gtk-driver xvfb xdotool
          cargo install tauri-driver --locked

      - name: The editor, the packaged server, and the shell beside it
        run: |
          npm ci --prefix web --no-audit --no-fund
          npm --prefix web run build
          pip install -c server/constraints.txt -e "./server[media,desktop]"
          # The harness signs its own update feed with a throwaway key (scripts/minisign.py).
          pip install cryptography
          python desktop/sidecar/build.py
          cargo build --manifest-path desktop/shell/src-tauri/Cargo.toml
          cp desktop/sidecar/dist/curvevision-local desktop/shell/src-tauri/target/debug/

      - name: The application, driven over WebDriver
        run: python scripts/verify_desktop_shell.py
