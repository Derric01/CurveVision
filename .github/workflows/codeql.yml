# CodeQL: GitHub's semantic code analysis, for Python, TypeScript and the workflows
# themselves, with findings in the repository's Security tab. Free for public repositories;
# skipped while this one is private (it would need GitHub Advanced Security).
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 3 * * 3'

permissions:
  contents: read

jobs:
  analyze:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
