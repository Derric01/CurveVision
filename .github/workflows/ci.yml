name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server (lint, types, tests)
    runs-on: ubuntu-latest
    # Only for the step that says so: the suite itself needs no services.
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: Install
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e ".[dev,saml]"

      - name: Ruff
        working-directory: server
        run: |
          ruff check .
          ruff format --check .

      # Lint only, not format: these harness scripts use a deliberate, hand-aligned
      # multi-line call style `ruff format` would rewrite wholesale. `scripts/ruff.toml`
      # is a bare ruff config rather than a pyproject.toml because this is not a package.
      - name: Ruff (scripts/)
        run: ruff check scripts

      # The generated web API types must match the schema this server declares. Needs the
      # web's generator, so Node comes in here too; the contract between those types and
      # the hand-written ones is checked by the web job's TypeScript step.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: API types match the server
        run: |
          npm ci --prefix web --no-audit --no-fund
          python scripts/api_types.py --check

      - name: Mypy
        working-directory: server
        run: mypy curvevision

      # SQLite first: fast, and it proves the promise that the suite needs no services.
      - name: Tests (SQLite)
        working-directory: server
        run: pytest -q

      # The rate limit several instances share: skipped above, where no Redis is named.
      - name: Rate limit shared through Redis
        working-directory: server
        env:
          CURVEVISION_TEST_REDIS_URL: redis://localhost:6379/0
        run: pytest tests/api/test_rate_limit.py -q

      - name: Migration round-trip
        working-directory: server
        env:
          CURVEVISION_DATABASE_URL: sqlite+aiosqlite:///./ci.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  server-postgres:
    name: Server (PostgreSQL integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: curvevision
          POSTGRES_PASSWORD: curvevision
          POSTGRES_DB: curvevision_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # An S3-compatible server for the S3 storage backend's tests. Versity Gateway rather
      # than MinIO, whose images can no longer be pulled anonymously (iteration 84).
      s3:
        image: versity/versitygw:v1.8.0
        env:
          ROOT_ACCESS_KEY: curvevision
          ROOT_SECRET_KEY: curvevision-ci-secret
          VGW_PORT: ':7070'
          VGW_BACKEND: posix
          VGW_BACKEND_ARG: /tmp/vgw
        ports: ['7070:7070']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: Install
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e ".[dev,postgres,s3,saml]"

      # The unit suite runs on SQLite; this job proves the schema and the
      # Postgres-specific column variants (JSONB, native uuid) actually work.
      - name: Migrations against PostgreSQL
        working-directory: server
        env:
          CURVEVISION_DATABASE_URL: postgresql+asyncpg://curvevision:curvevision@localhost:5432/curvevision_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      # A data migration does nothing to an empty database, so the steps above cannot
      # exercise one. This writes rows the old way and runs the repair over them, on the
      # native uuid and JSONB columns SQLite does not have.
      - name: Data migrations against PostgreSQL
        working-directory: server
        env:
          CURVEVISION_TEST_POSTGRES_URL: postgresql+asyncpg://curvevision:curvevision@localhost:5432/curvevision_test
        run: pytest tests/api/test_joint_repair_migration.py -q

      # A backup written from SQLite, the desktop's database, restored into PostgreSQL:
      # the move from working alone to a team server.
      - name: Backup restored into PostgreSQL
        working-directory: server
        env:
          CURVEVISION_TEST_POSTGRES_URL: postgresql+asyncpg://curvevision:curvevision@localhost:5432/curvevision_test
        run: pytest tests/api/test_backup.py -q

      # Every server deployment keeps its media in S3; the rest of the suite runs on local
      # storage, so this is the only place the S3 backend meets an S3 server.
      - name: Object storage against an S3 server
        working-directory: server
        env:
          CURVEVISION_TEST_S3_URL: http://localhost:7070
          CURVEVISION_TEST_S3_ACCESS_KEY: curvevision
          CURVEVISION_TEST_S3_SECRET_KEY: curvevision-ci-secret
        # A skip here would be a silent pass, so one fails the step.
        run: |
          pytest tests/api/test_s3_storage.py -q -rs | tee s3.log
          ! grep -q skipped s3.log

  clamav:
    name: Content scanning against ClamAV
    runs-on: ubuntu-latest
    # The official image ships its signatures; clamd takes a minute or two to load them,
    # which the health check waits out before the steps start.
    services:
      clamav:
        image: clamav/clamav:stable
        ports: ['3310:3310']
        options: >-
          --health-cmd "clamdcheck.sh"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: Install
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e ".[dev,saml]"

      - name: Scan with clamd
        working-directory: server
        env:
          CURVEVISION_TEST_CLAMD: 127.0.0.1:3310
        run: pytest tests/api/test_content_scanning.py -q

  sdk:
    name: SDK and CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c server/constraints.txt -e "./server[dev]" -e "./sdk/python[dev]"

      - name: Ruff
        working-directory: sdk/python
        run: |
          ruff check .
          ruff format --check .

      - name: Mypy
        working-directory: sdk/python
        run: mypy curvevision_sdk

      # These run against a real uvicorn server over HTTP, not an in-process transport.
      - name: Tests
        working-directory: sdk/python
        run: pytest -q

      # The TypeScript client: typed from the server's schema (the `server` job checks the
      # generated copy is current), built as it would be published, and tested against a
      # real server like the Python SDK.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: TypeScript client
        run: |
          npm ci --prefix sdk/typescript --no-audit --no-fund
          npm --prefix sdk/typescript run typecheck
          npm --prefix sdk/typescript run build
          python scripts/with_server.py -- npm --prefix sdk/typescript test
          cd sdk/typescript && npm pack --dry-run

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: ESLint
        working-directory: web
        run: npm run lint

      - name: TypeScript
        working-directory: web
        run: npm run typecheck

      - name: Tests
        working-directory: web
        run: npm run test

      - name: Build
        working-directory: web
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.server
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.web
          push: false
          load: true
          tags: curvevision-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # nginx renders its config from a template at start: the API it proxies to is
      # `api:8000` under Compose and the release's own service under the Helm chart.
      - name: The web image proxies to the API it is told to
        run: |
          docker run --rm --add-host api:127.0.0.1 curvevision-web:ci nginx -T \
            | grep -F 'proxy_pass http://api:8000;'
          docker run --rm --add-host demo-curvevision-api:127.0.0.1 \
            -e CURVEVISION_API_UPSTREAM=demo-curvevision-api:8000 curvevision-web:ci nginx -T \
            | grep -F 'proxy_pass http://demo-curvevision-api:8000;'

      # The self-hosted deployment as the README tells a person to run it, then used through
      # the web service: register, upload an image to object storage and read it back,
      # annotate, export — and a backup taken from inside the stack.
      - name: docker compose up, and use it
        env:
          CURVEVISION_SECRET_KEY: compose-ci-secret-key-not-used-anywhere-real-0123456789
          S3_SECRET_KEY: compose-ci-s3-secret
          POSTGRES_PASSWORD: compose-ci-postgres
        run: |
          docker compose up -d --build
          python3 scripts/helm_smoke.py http://127.0.0.1:8080
          docker compose exec -T api curvevision-server backup /backups/ci.tar
          docker compose cp api:/backups/ci.tar ci.tar
          test -s ci.tar

      - name: What Compose said, when anything failed
        if: failure()
        env:
          CURVEVISION_SECRET_KEY: compose-ci-secret-key-not-used-anywhere-real-0123456789
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 200

  helm:
    name: Helm chart renders valid manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.2

      - name: Lint, render and validate against the Kubernetes schemas
        working-directory: deploy/helm
        run: |
          # Retried: GitHub's release downloads answer 5xx at times (a 504 failed this job once).
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz kubeconform
          set -- --set secretKey=s --set database.url=postgresql+asyncpg://u:p@db/cv \
                 --set redis.url=redis://r:6379/0
          helm lint curvevision "$@"
          helm template demo curvevision "$@" --set ingress.enabled=true \
            | ./kubeconform -strict -summary -kubernetes-version 1.30.0 -
          helm template demo curvevision --set existingSecret=mine \
            | ./kubeconform -strict -summary -kubernetes-version 1.30.0 -
          # Without its required values the chart refuses, and says which.
          ! helm template demo curvevision 2> refused.txt
          grep -q "Set secretKey" refused.txt

  helm-install:
    name: Helm chart installs and serves, in kind
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.server
          load: true
          tags: curvevision-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.web
          load: true
          tags: curvevision-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # kind, built from its source through Go's module proxy rather than downloaded from
      # GitHub's release servers, which answered 504 for this file for hours on 2026-11-09
      # (helm/kind-action fetches only from there). The module proxy is a separate service,
      # and `go install` checks what it fetches against Go's public checksum database.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: A kind cluster
        run: |
          go install sigs.k8s.io/kind@v0.31.0
          sudo install -m 0755 "$(go env GOPATH)/bin/kind" /usr/local/bin/kind
          kind version
          kind create cluster --name curvevision --wait 60s
          kubectl cluster-info
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.2

      # What the chart leaves to the operator — PostgreSQL, Redis, S3 — at its smallest.
      - name: Load the images, and start what the chart expects to find
        run: |
          kind load docker-image curvevision-server:ci curvevision-web:ci --name curvevision
          kubectl apply -f deploy/helm/ci/dependencies.yaml
          kubectl wait --for=condition=available deploy/postgres deploy/redis deploy/s3 --timeout=300s

      # The store starts empty: the chart's storage-init hook has to make the bucket, or the
      # upload in the smoke test below fails.
      - name: Turning the bucket hook off leaves it out
        run: |
          helm template cv deploy/helm/curvevision -f deploy/helm/ci/values.yaml \
            | grep -q 'name: cv-curvevision-storage-init'
          ! helm template cv deploy/helm/curvevision -f deploy/helm/ci/values.yaml \
            --set storage.s3.createBucket=false | grep -q storage-init

      - name: helm install, and wait for every pod to be ready
        run: >
          helm install cv deploy/helm/curvevision -f deploy/helm/ci/values.yaml
          --wait --timeout 10m

      # Through the web pods' nginx, the API Service and pods, and everything behind them.
      - name: Use it as a person would
        run: |
          kubectl port-forward svc/cv-curvevision-web 8080:80 > /dev/null 2>&1 &
          sleep 3
          python3 scripts/helm_smoke.py http://127.0.0.1:8080

      - name: Back it up from inside the cluster
        run: |
          kubectl exec deploy/cv-curvevision-api -- curvevision-server backup /tmp/cv.tar
          kubectl exec deploy/cv-curvevision-api -- ls -l /tmp/cv.tar

      - name: helm upgrade runs the migration hook again
        run: >
          helm upgrade cv deploy/helm/curvevision -f deploy/helm/ci/values.yaml
          --wait --timeout 10m

      - name: What the cluster said, when anything failed
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl describe pods
          kubectl logs -l app.kubernetes.io/instance=cv --all-containers --tail=200 --prefix

  licenses:
    name: Third-party notices are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # A dependency that reaches users without an attribution entry is a licensing
      # problem, so it fails the build rather than being noticed later.
      - name: Check notices cover declared dependencies
        run: python scripts/check_notices.py

      # What ships installs at the versions CI tested (server/constraints.txt): a dependency
      # declared without a pinned version would install at whatever was newest that day.
      - name: Check every declared dependency has a pinned version
        run: python scripts/check_constraints.py
