# Pull requests that move a dependency to a fixed version when an advisory is published, and
# keep the workflows' actions current. Security updates are what matter; routine version
# bumps are grouped and weekly so they do not drown them.
version: 2
updates:
  - package-ecosystem: pip
    directory: /server
    schedule: {interval: weekly}
    groups:
      python: {patterns: ['*']}
  - package-ecosystem: npm
    directory: /web
    schedule: {interval: weekly}
    groups:
      web: {patterns: ['*']}
  - package-ecosystem: npm
    directory: /sdk/typescript
    schedule: {interval: weekly}
    groups:
      sdk: {patterns: ['*']}
  - package-ecosystem: cargo
    directory: /desktop/shell/src-tauri
    schedule: {interval: weekly}
    groups:
      desktop: {patterns: ['*']}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ['*']}
