[package]
name = "curvevision-desktop"
version = "0.1.0"
description = "CurveVision — annotate computer-vision datasets on your own machine"
authors = ["CurveVision contributors"]
license = "MIT"
repository = "https://github.com/Derric01/CurveVision"
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri v2 builds the application as a library so the same entry point serves desktop and
# mobile targets. `main.rs` is a three-line wrapper around it.
name = "curvevision_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# A desktop binary is downloaded once and run many times, so trade build time for size
# and speed. `panic = "abort"` also means a panic in the shell cannot leave the sidecar
# running as an orphan.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
