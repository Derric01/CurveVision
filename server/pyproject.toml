[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "curvevision-server"
version = "0.1.0"
description = "CurveVision — open-source annotation and dataset infrastructure for computer vision"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CurveVision contributors" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.7",  # NoDecode
    "email-validator>=2.2",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    # The default database (`sqlite+aiosqlite://`), and the only one a desktop installation
    # uses. Not optional: without it the zero-configuration server cannot start, and the
    # desktop installers built from `[media,desktop]` shipped without it (iteration 84).
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    # Claude, through its official SDK (ADR 0010). Brings httpx2, jiter, docstring-parser.
    "anthropic>=1.13,<2",
    "prometheus-client>=0.20",
    # The operating system's certificate store, for the one request a desktop installation
    # makes to another server: checking a team server before switching to it.
    "truststore>=0.10",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29", "psycopg[binary]>=3.1"]
s3 = ["boto3>=1.34"]
media = ["pillow>=10.3", "av>=12.0"]
worker = ["dramatiq[redis]>=1.17", "redis>=5.0"]
# A rate limit shared by every instance of the server (`rate_limit_backend = "redis"`).
redis = ["redis>=5.0"]
# Single sign-on through an OpenID Connect provider (`oidc_enabled`): RS256/ES256 ID tokens.
oidc = ["pyjwt[crypto]>=2.8"]
# Single sign-on through a SAML 2.0 identity provider (`saml_enabled`): python3-saml verifies
# the XML signatures, through xmlsec.
saml = ["python3-saml>=1.16", "pyjwt>=2.8"]
# OpenTelemetry tracing to an OTLP/HTTP collector (`tracing_enabled`).
tracing = [
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
]
# The long tail of dataset formats (ImageNet, MNIST, WIDER FACE, DOTA, CamVid, ...), through
# Datumaro: `formats/datumaro_bridge.py`. Heavy, so not in the desktop build or the default image.
datumaro = ["datumaro>=1.10"]
# Everything needed to package the local server for the desktop application. `media` is
# included because a desktop build without image probing would ship an annotation tool
# that cannot read image dimensions.
desktop = ["pyinstaller>=6.6", "pillow>=10.3"]
dev = [
    "pytest>=8.2",
    # The Redis rate limiter's tests run against a real server when one is configured.
    "redis>=5.0",
    # Background jobs reach the deployment's Redis, and a worker knows every job kind
    # (tests/api/test_dramatiq_broker.py) — the `worker` extra's package, listed again.
    "dramatiq[redis]>=1.17",
    # Single sign-on's tests verify real RS256 signatures.
    "pyjwt[crypto]>=2.8",
    # Tracing is optional for a server and tested here, against an in-memory exporter. The
    # `tracing` extra's packages, listed again: an extra that names its own package is
    # not something every installer resolves.
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-boto3",
    # Installed in dev so the media path is exercised against real files rather than
    # skipped. The server itself treats both as optional and degrades gracefully: without
    # Pillow, dimensions are unknown; without PyAV, video support raises a clear error.
    # Without them *in CI*, though, the video tests silently skip and the hardest code in
    # the repository ships untested — which is the failure this line prevents.
    "pillow>=10.3",
    "av>=12.0",
    # The reference COCO reader, so exports are held to what every COCO consumer reads
    # through rather than only to this project's own importer (tests/unit/test_coco_reference.py).
    "pycocotools>=2.0.7",
]

[project.scripts]
curvevision-server = "curvevision.cli:main"
# The sidecar the desktop shell spawns. Also runnable by hand, which is the simplest way
# to get a zero-configuration local instance without the installer.
curvevision-local = "curvevision.desktop:main"

[tool.hatch.build.targets.wheel]
packages = ["curvevision"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["curvevision/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
# ASYNC240: blocking filesystem calls are a real problem in a request handler and a
# non-problem in a test, which has no other work to starve.
"tests/**" = ["B011", "ASYNC240"]

[tool.mypy]
python_version = "3.11"
plugins = []
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ["curvevision/migrations/", "tests/"]

[[tool.mypy.overrides]]
module = ["dramatiq.*", "boto3.*", "botocore.*", "av.*", "PIL.*", "argon2.*", "prometheus_client.*", "datumaro.*", "onelogin.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "benchmark: performance benchmarks, excluded from the default run",
    "postgres: requires a live PostgreSQL instance",
]
filterwarnings = ["ignore::DeprecationWarning:passlib.*"]
