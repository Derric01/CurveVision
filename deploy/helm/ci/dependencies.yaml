# What the chart expects an operator to provide, at its smallest: for CI's `kind` install
# (`.github/workflows/ci.yml`, job `helm-install`), not for production. Each is one pod
# with no persistence.
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres}
spec:
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_USER, value: curvevision}
            - {name: POSTGRES_PASSWORD, value: curvevision}
            - {name: POSTGRES_DB, value: curvevision}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -U, curvevision]}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata: {name: postgres}
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis}
spec:
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{containerPort: 6379}]
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata: {name: redis}
spec:
  selector: {app: redis}
  ports: [{port: 6379}]
---
# Object storage: Versity Gateway, serving a directory as S3 (MinIO's images can no longer
# be pulled anonymously). Metadata in a sidecar directory rather than extended attributes.
apiVersion: apps/v1
kind: Deployment
metadata: {name: s3}
spec:
  selector: {matchLabels: {app: s3}}
  template:
    metadata: {labels: {app: s3}}
    spec:
      containers:
        - name: s3
          image: versity/versitygw:v1.8.0
          args: ["--port", ":9000", "--health", "/health", posix, --sidecar, /meta, /objects]
          env:
            - {name: ROOT_ACCESS_KEY, value: curvevision}
            - {name: ROOT_SECRET_KEY, value: curvevision-ci-secret}
          ports: [{containerPort: 9000}]
          readinessProbe:
            httpGet: {path: /health, port: 9000}
            periodSeconds: 3
          volumeMounts:
            - {name: objects, mountPath: /objects}
            - {name: meta, mountPath: /meta}
      volumes:
        - {name: objects, emptyDir: {}}
        - {name: meta, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: s3}
spec:
  selector: {app: s3}
  ports: [{port: 9000}]
---
# The bucket, made the way `storage-init` makes it under Docker Compose: by the server
# image itself.
apiVersion: batch/v1
kind: Job
metadata: {name: storage-init}
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: storage-init
          image: curvevision-server:ci
          imagePullPolicy: Never
          command: [curvevision-server, storage-init]
          env:
            - {name: CURVEVISION_STORAGE_BACKEND, value: s3}
            - {name: CURVEVISION_S3_ENDPOINT_URL, value: "http://s3:9000"}
            - {name: CURVEVISION_S3_BUCKET, value: curvevision}
            - {name: CURVEVISION_S3_ACCESS_KEY_ID, value: curvevision}
            - {name: CURVEVISION_S3_SECRET_ACCESS_KEY, value: curvevision-ci-secret}
