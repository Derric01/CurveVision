{{- if .Values.storage.s3.createBucket }}
# Before the migrations, on install and upgrade: make the bucket if it is not there, as
# `storage-init` does under Docker Compose — so a fresh install fails here, on a clear setup
# step, rather than on someone's first upload. Safe to repeat. Turn it off
# (`storage.s3.createBucket: false`) when the bucket is made elsewhere and this release's
# credentials may not look for it: without `s3:ListBucket`, S3 answers HeadBucket with 403,
# and this hook, and so the install, would fail.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "curvevision.fullname" . }}-storage-init
  labels:
    {{- include "curvevision.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage-init
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "curvevision.selector" (dict "root" . "component" "storage-init") | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: storage-init
          image: {{ include "curvevision.serverImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [curvevision-server, storage-init]
          # A hook runs before the release's own ConfigMap and Secret exist on first
          # install, so it carries what it needs itself.
          env:
            - {name: CURVEVISION_STORAGE_BACKEND, value: s3}
            - name: CURVEVISION_S3_BUCKET
              value: {{ .Values.storage.s3.bucket | quote }}
            {{- with .Values.storage.s3.endpointUrl }}
            - name: CURVEVISION_S3_ENDPOINT_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.storage.s3.region }}
            - name: CURVEVISION_S3_REGION
              value: {{ . | quote }}
            {{- end }}
            - name: CURVEVISION_S3_FORCE_PATH_STYLE
              value: {{ .Values.storage.s3.forcePathStyle | quote }}
            {{- if .Values.existingSecret }}
            - name: CURVEVISION_S3_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: s3-access-key-id, optional: true}}
            - name: CURVEVISION_S3_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: s3-secret-access-key, optional: true}}
            {{- else }}
            {{- with .Values.storage.s3.accessKeyId }}
            - name: CURVEVISION_S3_ACCESS_KEY_ID
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.storage.s3.secretAccessKey }}
            - name: CURVEVISION_S3_SECRET_ACCESS_KEY
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
{{- end }}
