{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "curvevision.secretName" . }}
  labels:
    {{- include "curvevision.labels" . | nindent 4 }}
type: Opaque
stringData:
  secret-key: {{ .Values.secretKey | quote }}
  database-url: {{ .Values.database.url | quote }}
  redis-url: {{ .Values.redis.url | quote }}
  {{- with .Values.storage.s3.accessKeyId }}
  s3-access-key-id: {{ . | quote }}
  {{- end }}
  {{- with .Values.storage.s3.secretAccessKey }}
  s3-secret-access-key: {{ . | quote }}
  {{- end }}
{{- end }}
