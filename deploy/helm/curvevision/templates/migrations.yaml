{{- if .Values.migrations.enabled }}
# Once per install and upgrade, before the new pods start: `alembic upgrade head` in every
# API replica at start would race when two start together.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "curvevision.fullname" . }}-migrate
  labels:
    {{- include "curvevision.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "curvevision.selector" (dict "root" . "component" "migrations") | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: migrate
          image: {{ include "curvevision.serverImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [alembic, upgrade, head]
          # A hook runs before the release's own ConfigMap and Secret exist on first
          # install, so it carries what migrations need itself.
          env:
            {{- if .Values.existingSecret }}
            - name: CURVEVISION_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: database-url}}
            {{- else }}
            - name: CURVEVISION_DATABASE_URL
              value: {{ .Values.database.url | quote }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
{{- end }}
