apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "curvevision.fullname" . }}-web
  labels:
    {{- include "curvevision.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "curvevision.selector" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "curvevision.selector" (dict "root" . "component" "web") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "curvevision.webImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # The web image's nginx proxies /api/ here (deploy/nginx.conf.template).
            - name: CURVEVISION_API_UPSTREAM
              value: {{ printf "%s-api:8000" (include "curvevision.fullname" .) | quote }}
          ports:
            - {name: http, containerPort: 80}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 30
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "curvevision.fullname" . }}-web
  labels:
    {{- include "curvevision.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "curvevision.selector" (dict "root" . "component" "web") | nindent 4 }}
  ports:
    - {name: http, port: 80, targetPort: http}
